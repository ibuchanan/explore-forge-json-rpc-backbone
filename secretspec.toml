[project]
name = "explore-forge-json-rpc-backbone"
revision = "1.0"

[profiles.default]
# Local controls: where and how `forge` commands operate. They are not app
# secrets; Fence Rider reads them to target the opt-in `forge:*` scripts.
# `providers` names a storage role, not a backend: each developer or CI
# operator binds `shared_config` to a backend in their own SecretSpec config.
# Use `project_config` instead if a target must not follow other projects.
FORGE_SITE = { description = "Forge site hostname, e.g. example.atlassian.net", required = true, providers = [
  "shared_config",
] }
FORGE_PRODUCT = { description = "Forge product (jira, confluence, compass, jsm)", default = "jira", providers = [
  "shared_config",
] }
FORGE_ENVIRONMENT = { description = "Forge environment name (development, staging, production)", default = "development", providers = [
  "shared_config",
] }

# Declare each app variable once in this profile, then list it in a scope:
#   [scopes.runtime]   uploaded encrypted by `npm run forge:variables:set`
#   [scopes.manifest]  must also be declared in manifest.yml
# Members of neither scope stay local. Never list FORGE_* controls in a scope.
#
# Route every value through an explicit storage role. Credentials use
# `project_secrets`; never fall back to a config role, and never define these
# aliases in a `[providers]` table here (that overrides user bindings).
# Other roles: `project_config`, `shared_secrets`. Scopes choose delivery to
# Forge, not storage or sensitivity.

# Web trigger binding (src/index.ts). Without both values, every web request
# returns 503. The ARI is the installation's `installContext`, known only after
# install; set a placeholder for the first deploy, then the real value.
RPC_INSTALLATION_ARI = { description = "Installation ARI the web trigger accepts, e.g. ari:cloud:ecosystem::installation/<id>", required = true, providers = [
  "project_config",
] }
RPC_JIRA_SITE_URL = { description = "https://<site>.atlassian.net origin used to verify callers as Jira admins", required = true, providers = [
  "project_config",
] }

# Local inputs for `npm run test:deployed`; never uploaded.
RPC_VERIFY_URL = { description = "config-rpc web trigger URL for the selected installation", required = false, providers = [
  "project_config",
] }
RPC_VERIFY_EMAIL = { description = "Email of a Jira administrator on the target site", required = false, providers = [
  "project_config",
] }
RPC_VERIFY_API_TOKEN = { description = "Atlassian API token for RPC_VERIFY_EMAIL", required = false, providers = [
  "project_secrets",
] }

[scopes.runtime]
secrets = ["RPC_INSTALLATION_ARI", "RPC_JIRA_SITE_URL"]
