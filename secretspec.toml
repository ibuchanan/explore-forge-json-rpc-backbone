[project]
name = "explore-forge-json-rpc-backbone"
revision = "1.0"

# Bind these semantic aliases in user-global SecretSpec configuration.
# Keep backend locations out of this declaration; project aliases override users.
# Local controls are non-secret settings shared across participating projects.
[profiles.default.FORGE_SITE]
description = "Forge site hostname, e.g. example.atlassian.net"
required = true
providers = ["shared_config"]

[profiles.default.FORGE_PRODUCT]
description = "Forge product (jira, confluence, compass, jsm)"
default = "jira"
providers = ["shared_config"]

[profiles.default.FORGE_ENVIRONMENT]
description = "Forge environment name (development, staging, production)"
default = "development"
providers = ["shared_config"]

# Project/profile-isolated credentials require an approved secret backend.
# Upload encrypted via `npm run forge:variables:set`; FORGE_* controls stay local.
[profiles.default.RPC_BEARER_SECRET]
description = "Encrypted runtime bearer credential for approved API operators"
required = true
providers = ["project_secrets"]

[scopes.runtime]
secrets = ["RPC_BEARER_SECRET"]
