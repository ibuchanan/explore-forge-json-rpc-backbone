modules:
  webtrigger:
    - key: config-rpc
      function: rpc
      urlFormat: v2
      response:
        type: dynamic
  function:
    - key: rpc
      handler: index.run
    - key: config-resolver
      handler: resolver.handler
  jira:adminPage:
    - key: config-admin
      resource: config-ui
      render: native
      resolver:
        function: config-resolver
      title: JSON-RPC configuration
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/b4fb5180-6f8a-4652-afdc-56e68ba7adbd
permissions:
  scopes:
    - storage:app
    - read:jira-work
resources:
  - key: config-ui
    path: src/frontend/index.tsx
